<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beau Hudak</title>
<meta name="description" content="Beau Hudak, Creative Director in games. New site coming soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;900&family=Libre+Franklin:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single holding frame, like a slate before the cut. */
:root{
  --bg:#111318; --line:#2a2e39; --fg:#e9eaef; --muted:#959bab; --accent:#4da3ff; --ink:#0d0f14;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f2f3f6; --line:#d8dbe3; --fg:#14161c; --muted:#596072; --accent:#1f6fd6; --ink:#ffffff; color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
.frame{flex:1;width:100%;max-width:1120px;margin:0 auto;display:grid;align-content:center;gap:28px;padding-block:64px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
@media (prefers-reduced-motion: no-preference){.rec i{animation:blink 1.4s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}}
h1{font-family:var(--display);font-weight:900;font-size:clamp(64px,13vw,168px);line-height:.95;text-transform:uppercase;margin:0;letter-spacing:-.01em}
h1 span{display:block;color:var(--muted);font-weight:600;font-size:.36em;letter-spacing:.04em;margin-top:.35em}
p{margin:0;max-width:52ch;font-size:clamp(17px,2vw,20px)}
.bar{height:2px;background:var(--line);position:relative;max-width:420px}
.bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:12px 18px;border:1px solid var(--line);border-radius:2px;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
code{font-family:var(--mono);font-size:15px;user-select:all}
footer{width:100%;max-width:1120px;margin:0 auto;border-top:1px solid var(--line);padding-block:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="frame">
  <span class="mono rec"><i></i>Rendering</span>
  <h1>Beau Hudak<span>Creative Director · Games</span></h1>
  <div class="bar" aria-hidden="true"></div>
  <p>A new site is in the edit. In the meantime, the reel is the best place to see the work.</p>
  <div class="row">
    <a class="btn primary" href="https://snack.video" target="_blank" rel="noopener">Watch the reel</a>
    <code>beau.hudak@gmail.com</code>
  </div>
</main>
<footer class="mono"><span>© 2026 Beau Hudak</span><span>Rochester, MN</span></footer>
</body>
</html>
