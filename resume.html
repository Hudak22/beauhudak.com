<style>
:root{--black:#000;--fg:#f4f1f1;--dim:#8f8888;--rule:#221a1b;--red:#e50914;--red-hi:#ff2a35;--text2:#cdc6c6;
  --title:"Saira Semi Condensed","Arial Narrow",sans-serif;--body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;
  background:radial-gradient(50% 60% at 50% 40%,rgba(229,9,20,.12),transparent 70%),var(--black);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:440px;display:grid;gap:22px;text-align:center;justify-items:center}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;font-family:var(--title);font-weight:800;font-size:clamp(44px,12vw,72px);line-height:.92;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,#ececec 60%,#a9a9a9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.start{font-family:"Chakra Petch",var(--mono);font-weight:700;font-size:14px;letter-spacing:.4em;padding-left:.4em;text-transform:uppercase;color:var(--red);margin:0}
form{width:100%;display:grid;gap:12px;margin-top:6px}
label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:left}
input{width:100%;font:500 17px/1.2 var(--mono);color:var(--fg);background:#0b0707;border:1px solid #3a2a2b;padding:14px 14px;outline:none}
input:focus{border-color:var(--red)}
button{font-family:"Chakra Petch",var(--mono);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:14px 22px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
button:hover{background:var(--red-hi)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.msg{min-height:1.4em;font-size:14px;color:var(--text2);margin:0}
.msg.err{color:#ff6b72}
a{color:var(--text2)}
@media (prefers-reduced-motion:no-preference){.start{animation:blink 1.1s steps(2,jump-none) infinite}@keyframes blink{50%{opacity:.15}}}
</style>
</head>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function norm(s){return s.trim().toLowerCase().replace(/[\s_]+/g,'-').replace(/-+/g,'-')}
  async function unlock(pass,quiet){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
    try{sessionStorage.setItem('bh-resume',pass)}catch(e){}
    var html=new TextDecoder().decode(out);
    document.open();document.write(html);document.close();
  }
  if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser can\'t open the page. Try a current version of Chrome, Safari, Firefox or Edge.';msg.className='msg err';go.disabled=true;return}
  f.addEventListener('submit',async function(e){
    e.preventDefault(); go.disabled=true; msg.className='msg'; msg.textContent='Unlocking…';
    try{await unlock(norm(pw.value))}
    catch(err){go.disabled=false;msg.className='msg err';msg.textContent='That passphrase didn\'t work. Check the spelling and try again.';pw.select()}
  });
  try{var saved=sessionStorage.getItem('bh-resume');if(saved){msg.textContent='Unlocking…';unlock(saved).catch(function(){msg.textContent='';try{sessionStorage.removeItem('bh-resume')}catch(e){}})}}catch(e){}
  pw.focus();
})();
</script>
